services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keyrail
      POSTGRES_USER: keyrail
      POSTGRES_PASSWORD: keyrail-local-only
    ports:
      - "5432:5432"
    volumes:
      - keyrail-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keyrail -d keyrail"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - keyrail-redis:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  keyrail-postgres:
  keyrail-redis:
