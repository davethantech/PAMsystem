worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  server_tokens off;

  # edge tier: TLS 1.3 only, hardened headers, routes to the private api network
  server {
    listen 443 ssl;
    http2 on;
    server_name pam.keyrail.local;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.3;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;

    # console (static frontend)
    location / {
      root /usr/share/nginx/html;
      try_files $uri /index.html;
    }

    # control-plane API — only surface exposed; everything else is private
    location /api/ {
      proxy_pass http://backend:8080/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /healthz {
      proxy_pass http://backend:8080/healthz;
    }
  }

  server {
    listen 80;
    return 301 https://$host$request_uri;   # no plaintext HTTP
  }
}
