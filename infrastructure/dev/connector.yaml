# Dev connector config — mounted by docker-compose into the "customer LAN" container.
cloud_url: wss://connector-gateway:8081/v1/tunnel
tenant_id: tnt_meridian_01
device_id: conn-sydney-01
cert_file: /etc/keyrail/certs/device.crt
key_file: /etc/keyrail/certs/device.key
ca_file: /etc/keyrail/certs/ca.crt
# Only these targets may ever be reached through the tunnel:
allow_targets:
  - db-int.meridian.local:5432
  - sw-core-01.meridian.local:22
audit_path: /var/log/keyrail/connector-audit.jsonl
