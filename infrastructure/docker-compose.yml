# Keyrail local development environment — mirrors the cloud topology:
# public edge (nginx) → api (private) → vault subnet (postgres/redis), with the
# connector on the "internal" network simulating a customer LAN.
name: keyrail

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: keyrail
      POSTGRES_PASSWORD: keyrail-dev-only
      POSTGRES_DB: keyrail
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../database/migrations:/docker-entrypoint-initdb.d:ro
    networks: [vault]                      # NOT reachable from the edge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keyrail"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes: [redisdata:/data]
    networks: [vault]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  backend:
    build: ../backend
    environment:
      PORT: 8080
      DATABASE_URL: postgres://keyrail:keyrail-dev-only@postgres:5432/keyrail
      REDIS_URL: redis://redis:6379
      PG_SSL: "false"
      KMS_PROVIDER: local                  # set to "aws" + KMS_KEY_ID in cloud
      KMS_KEY_ID: ${KMS_KEY_ID:-}
      COOKIE_SECRET: ${COOKIE_SECRET:?set a 64-byte secret}
      ISSUER: https://pam.keyrail.local
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [api, vault]                 # api-facing, vault-reachable
    ports: ["127.0.0.1:8081:8080"]         # loopback only — for smoke.mjs / local debugging
    restart: unless-stopped

  connector-gateway:
    build: ../backend
    command: ["node", "dist/main.js", "--gateway"]
    environment:
      PORT: 8081
      DATABASE_URL: postgres://keyrail:keyrail-dev-only@postgres:5432/keyrail
      REDIS_URL: redis://redis:6379
      COOKIE_SECRET: ${COOKIE_SECRET:?}
    depends_on: [postgres, redis]
    networks: [api, vault, internal]       # bridges cloud ↔ connector tunnel
    restart: unless-stopped

  connector:
    build: ../connector
    environment:
      KEYRAIL_CONFIG: /etc/keyrail/connector.yaml
    volumes:
      - ./dev/connector.yaml:/etc/keyrail/connector.yaml:ro
      - ./dev/certs:/etc/keyrail/certs:ro
    networks: [internal]                   # simulates the customer LAN
    depends_on: [connector-gateway]
    restart: unless-stopped

  edge:
    image: nginx:1.27-alpine
    ports: ["443:443", "80:80"]            # only public surface
    volumes:
      - ./dev/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./dev/certs:/etc/nginx/certs:ro
      - ../frontend-dist:/usr/share/nginx/html:ro
    depends_on: [backend]
    networks: [edge, api]
    restart: unless-stopped

networks:
  edge: {}
  api: { internal: true }
  vault: { internal: true }                # postgres/redis: no public route
  internal: { internal: true }             # customer LAN simulation

volumes:
  pgdata: {}
  redisdata: {}
