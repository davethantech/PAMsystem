# Keyrail production topology — AWS / Azure / GCP agnostic.
# Tiers: edge (public) → api → pam/vault services (private) → data (isolated).
# Secrets come from your secret manager (ASM/Key Vault/Secrets Manager) via
# External Secrets Operator — never from plaintext manifests.
---
apiVersion: v1
kind: Namespace
metadata: { name: keyrail, labels: { pod-security.kubernetes.io/enforce: restricted } }
---
# default-deny: nothing talks unless explicitly allowed
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny-all, namespace: keyrail }
spec: { podSelector: {}, policyTypes: [Ingress, Egress] }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-edge-to-api, namespace: keyrail }
spec:
  podSelector: { matchLabels: { app: api } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: edge } } }]
      ports: [{ port: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-api-to-data, namespace: keyrail }
spec:
  podSelector: { matchLabels: { tier: data } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { tier: app } } }]
      ports: [{ port: 5432 }, { port: 6379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: api, namespace: keyrail, labels: { app: api, tier: app } }
spec:
  replicas: 3
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 1, maxSurge: 1 } }
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api, tier: app } }
    spec:
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: api
          image: ghcr.io/keyrail/backend:1.0.0
          ports: [{ containerPort: 8080 }]
          envFrom: [{ secretRef: { name: api-env } }]   # ExternalSecret-managed
          resources: { requests: { cpu: 250m, memory: 256Mi }, limits: { cpu: "1", memory: 512Mi } }
          readinessProbe: { httpGet: { path: /healthz, port: 8080 }, periodSeconds: 5, failureThreshold: 3 }
          livenessProbe: { httpGet: { path: /healthz, port: 8080 }, periodSeconds: 15 }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: pam, namespace: keyrail, labels: { app: pam, tier: app } }
spec:
  replicas: 2
  selector: { matchLabels: { app: pam } }
  template:
    metadata: { labels: { app: pam, tier: app } }
    spec:
      containers:
        - name: pam
          image: ghcr.io/keyrail/backend:1.0.0
          args: ["--pam-service"]
          envFrom: [{ secretRef: { name: api-env } }]
          resources: { requests: { cpu: 250m, memory: 256Mi } }
          readinessProbe: { httpGet: { path: /healthz, port: 8080 }, periodSeconds: 5 }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: session-gateway, namespace: keyrail, labels: { app: gateway, tier: app } }
spec:
  replicas: 2
  selector: { matchLabels: { app: gateway } }
  template:
    metadata: { labels: { app: gateway, tier: app } }
    spec:
      containers:
        - name: gateway
          image: ghcr.io/keyrail/backend:1.0.0
          args: ["--gateway"]
          envFrom: [{ secretRef: { name: api-env } }]
          resources: { requests: { cpu: 500m, memory: 512Mi } }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres, namespace: keyrail, labels: { app: postgres, tier: data } }
spec:
  serviceName: postgres
  replicas: 2                      # primary + synchronous replica (Patroni in prod)
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres, tier: data } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          envFrom: [{ secretRef: { name: pg-env } }]
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
          resources: { requests: { cpu: "1", memory: 2Gi } }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 100Gi } } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis, namespace: keyrail, labels: { app: redis, tier: data } }
spec:
  replicas: 2
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis, tier: data } }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--appendonly", "yes"]
          resources: { requests: { cpu: 250m, memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: api, namespace: keyrail }
spec: { selector: { app: api }, ports: [{ port: 8080 }] }
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: keyrail }
spec: { selector: { app: postgres }, ports: [{ port: 5432 }], clusterIP: None }
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: keyrail }
spec: { selector: { app: redis }, ports: [{ port: 6379 }] }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keyrail, namespace: keyrail
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.3"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "Strict-Transport-Security: max-age=63072000; includeSubDomains; preload";
      more_set_headers "Content-Security-Policy: default-src 'self'; object-src 'none'";
spec:
  ingressClassName: nginx
  tls: [{ hosts: [pam.example.com], secretName: keyrail-tls }]
  rules:
    - host: pam.example.com
      http:
        paths:
          - { path: /api, pathType: Prefix, backend: { service: { name: api, port: { number: 8080 } } } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: api, namespace: keyrail }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api }
  minReplicas: 3
  maxReplicas: 12
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } } }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: api, namespace: keyrail }
spec: { minAvailable: 2, selector: { matchLabels: { app: api } } }
