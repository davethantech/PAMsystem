# Keyrail PAM Cloud - Production Configuration
# 
# This file is for production deployment on Linux VPS or cloud VMs.
# All services run in containers with production-grade security settings.
#
# Architecture:
#   Internet -> Nginx (TLS termination) -> Frontend/API -> Internal Network -> PostgreSQL/Redis
#
# Security Notes:
#   - PostgreSQL and Redis are NOT exposed publicly
#   - All communication between services is over internal Docker network
#   - TLS 1.3 is enforced at the edge
#   - Security headers are enforced by Nginx
#   - KMS_PROVIDER should be set to "aws", "azure", or "gcp" in production
#
# Usage:
#   # Set required environment variables
#   export COOKIE_SECRET=$(openssl rand -hex 32)
#   export DATABASE_URL=postgres://... (use strong credentials)
#   export KMS_PROVIDER=aws
#   export KMS_KEY_ID=arn:aws:kms:...:key/...
#   
#   # Start services
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
#   # Run migrations
#   docker compose exec backend npm run migrate
#
#   # Seed initial tenant (only once)
#   docker compose exec backend npm run seed
#
# Required Environment Variables:
#   COOKIE_SECRET: 64-byte hex string (openssl rand -hex 32)
#   DATABASE_URL: PostgreSQL connection string with strong credentials
#   REDIS_URL: Redis connection string
#   KMS_PROVIDER: "aws", "azure", or "gcp"
#   KMS_KEY_ID: Cloud KMS key ARN/ID
#   ISSUER: https://pam.yourdomain.com
#
# Optional:
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET: For Google OIDC
#   ENTRA_TENANT_ID, ENTRA_CLIENT_ID, ENTRA_CLIENT_SECRET: For Microsoft Entra

name: keyrail-pam-prod

services:
  # Production Nginx with TLS and security headers
  edge:
    image: nginx:1.27-alpine
    container_name: keyrail-edge-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/prod/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/prod/certs:/etc/nginx/certs:ro
      - ./frontend-dist:/usr/share/nginx/html:ro
    depends_on:
      - frontend
      - backend
    networks:
      - edge
      - api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true

  # Production frontend - Static files only
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: keyrail-frontend-prod
    environment:
      - NODE_ENV=production
      - VITE_API_URL=/api
    volumes:
      - ./public:/usr/share/nginx/html:ro
    networks:
      - api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true

  # Production backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: keyrail-backend-prod
    environment:
      - PORT=8080
      - DATABASE_URL=${DATABASE_URL:?err}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - PG_SSL=true
      - KMS_PROVIDER=${KMS_PROVIDER:-local}
      - KMS_KEY_ID=${KMS_KEY_ID:?err}
      - COOKIE_SECRET=${COOKIE_SECRET:?err}
      - ISSUER=${ISSUER:?err}
      - SESSION_TTL_MIN=${SESSION_TTL_MIN:-120}
      - IDLE_TIMEOUT_MIN=${IDLE_TIMEOUT_MIN:-15}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - api
      - vault
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Production PostgreSQL with persistent storage
  postgres:
    image: postgres:16-alpine
    container_name: keyrail-postgres-prod
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-keyrail}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?err}
      - POSTGRES_DB=${POSTGRES_DB:-keyrail}
    volumes:
      - pgdata-prod:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - vault
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-keyrail} -d ${POSTGRES_DB:-keyrail}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Production Redis with persistence
  redis:
    image: redis:7-alpine
    container_name: keyrail-redis-prod
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "1gb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata-prod:/data
    networks:
      - vault
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Production connector gateway
  connector-gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: keyrail-connector-gateway-prod
    command: ["node", "dist/main.js", "--gateway"]
    environment:
      - PORT=8081
      - DATABASE_URL=${DATABASE_URL:?err}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - COOKIE_SECRET=${COOKIE_SECRET:?err}
    depends_on:
      - postgres
      - redis
    networks:
      - api
      - vault
      - internal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Connector - Customer-side (not typically run in production compose)
  # This is shown for completeness; customers deploy this separately
  connector:
    build:
      context: ./connector
      dockerfile: Dockerfile
    container_name: keyrail-connector-prod
    environment:
      - KEYRAIL_CONFIG=/etc/keyrail/connector.yaml
    volumes:
      - ./infrastructure/prod/connector.yaml:/etc/keyrail/connector.yaml:ro
      - ./infrastructure/prod/certs:/etc/keyrail/certs:ro
    networks:
      - internal
    depends_on:
      - connector-gateway
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  edge:
    driver: bridge
  api:
    driver: bridge
    internal: true
  vault:
    driver: bridge
    internal: true
  internal:
    driver: bridge
    internal: true

volumes:
  pgdata-prod:
  redisdata-prod:
